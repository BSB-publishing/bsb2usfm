services:
  # Web service with UI
  web:
    build: .
    container_name: bsb2usfm_web
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/input:ro
      - ./results:/app/output
      - ./demo_data:/app/demo_data:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PORT=5000
    working_dir: /app
    command: python3 webapp.py
    restart: unless-stopped

  # CLI service (for backward compatibility)
  bsb2usfm:
    build: .
    container_name: bsb2usfm_converter
    volumes:
      - ./data:/app/input:ro
      - ./results:/app/output
      - ./demo_data:/app/demo_data:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: tail -f /dev/null  # Keep container running for interactive use
    profiles:
      - cli

  # CLI: Run a specific conversion job
  bsb2usfm-convert:
    build: .
    container_name: bsb2usfm_job
    volumes:
      - ./data:/app/input:ro
      - ./results:/app/output
      - ./demo_data:/app/demo_data:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: python3 bsb2usfm.py /app/input/bsb_tables.csv -o /app/output/%.usfm
    profiles:
      - cli
      - convert

  # CLI: Run reference extraction
  bsb2usfm-refs:
    build: .
    container_name: bsb2usfm_refs
    volumes:
      - ./results:/app/input:ro
      - ./results:/app/output
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: python3 getirefs.py /app/input/*.usfm -o /app/output/references.txt
    profiles:
      - cli
      - refs

volumes:
  bsb2usfm_data:
    driver: local
