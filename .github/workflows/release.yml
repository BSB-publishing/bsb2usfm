name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 5.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Verify Python installation
        run: |
          python3 --version
          which python3
          # Ensure python command also works
          if ! command -v python &> /dev/null; then
            sudo ln -sf $(which python3) /usr/local/bin/python || true
          fi
          python --version || python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Read version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Build all files
        run: make all

      - name: Verify workspace files
        run: |
          echo "Checking workspace directory..."
          ls -lh workspace/
          ls -lh workspace/usj/
          ls -lh workspace/usx/
          echo "Total ZIP files:"
          find workspace -name "*.zip" | wc -l

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: BSB v${{ steps.version.outputs.version }}
          body: |
            # Berean Standard Bible v${{ steps.version.outputs.version }}

            This release contains the complete Berean Standard Bible in USFM, USJ, and USX formats.

            ## 📦 What's Included

            ### USFM Format (Universal Standard Format Markers)
            - **BSB_usfm.zip** - Standard clean text
            - **BSB_int_usfm.zip** - With interlinear data
            - **BSB_strongs_usfm.zip** - With Strong's numbers
            - **BSB_full_strongs_usfm.zip** - Complete Strong's data

            ### USJ Format (Unified Scripture JSON)
            - **BSB_usj.zip** - Standard clean text
            - **BSB_int_usj.zip** - With interlinear data
            - **BSB_strongs_usj.zip** - With Strong's numbers
            - **BSB_full_strongs_usj.zip** - Complete Strong's data

            ### USX Format (Unified Scripture XML)
            - **BSB_usx.zip** - Standard clean text
            - **BSB_int_usx.zip** - With interlinear data
            - **BSB_strongs_usx.zip** - With Strong's numbers
            - **BSB_full_strongs_usx.zip** - Complete Strong's data

            ## 📖 Contents

            Each ZIP file contains all 66 books of the Bible (39 OT + 27 NT) with:
            - Complete text with verses and chapters
            - Section headings
            - Cross-references
            - Footnotes
            - Poetry formatting
            - Red letter (Jesus' words) markup

            ## 📄 License

            **Public Domain** - The Berean Standard Bible text is completely free to use:
            - ✅ Copy and distribute freely
            - ✅ Modify and adapt as needed
            - ✅ Use commercially without restriction
            - ✅ Use in any project (software, publications, apps, etc.)
            - ✅ Create derivative works

            **No restrictions.** No attribution required (though appreciated). No permission needed.

            The BSB text is dedicated to the public domain. See [UNLICENSE](https://github.com/${{ github.repository }}/blob/main/UNLICENSE) for details.

            ## 🔗 More Information

            Visit the [repository](https://github.com/${{ github.repository }}) for more details.
          draft: false
          prerelease: false

      - name: Upload USFM Standard
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/BSB_usfm.zip
          asset_name: BSB_usfm.zip
          asset_content_type: application/zip

      - name: Upload USFM Interlinear
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/int/BSB_int_usfm.zip
          asset_name: BSB_int_usfm.zip
          asset_content_type: application/zip

      - name: Upload USFM Strong's
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/strongs/BSB_strongs_usfm.zip
          asset_name: BSB_strongs_usfm.zip
          asset_content_type: application/zip

      - name: Upload USFM Strong's Full
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/strongs_full/BSB_full_strongs_usfm.zip
          asset_name: BSB_full_strongs_usfm.zip
          asset_content_type: application/zip

      - name: Upload USJ Standard
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usj/BSB_usj.zip
          asset_name: BSB_usj.zip
          asset_content_type: application/zip

      - name: Upload USJ Interlinear
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usj/int/BSB_int_usj.zip
          asset_name: BSB_int_usj.zip
          asset_content_type: application/zip

      - name: Upload USJ Strong's
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usj/strongs/BSB_strongs_usj.zip
          asset_name: BSB_strongs_usj.zip
          asset_content_type: application/zip

      - name: Upload USJ Strong's Full
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usj/strongs_full/BSB_full_strongs_usj.zip
          asset_name: BSB_full_strongs_usj.zip
          asset_content_type: application/zip

      - name: Upload USX Standard
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usx/BSB_usx.zip
          asset_name: BSB_usx.zip
          asset_content_type: application/zip

      - name: Upload USX Interlinear
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usx/int/BSB_int_usx.zip
          asset_name: BSB_int_usx.zip
          asset_content_type: application/zip

      - name: Upload USX Strong's
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usx/strongs/BSB_strongs_usx.zip
          asset_name: BSB_strongs_usx.zip
          asset_content_type: application/zip

      - name: Upload USX Strong's Full
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./workspace/usx/strongs_full/BSB_full_strongs_usx.zip
          asset_name: BSB_full_strongs_usx.zip
          asset_content_type: application/zip

      - name: Release Summary
        run: |
          echo "✅ Release v${{ steps.version.outputs.version }} created successfully!"
          echo "📦 12 ZIP files uploaded as release assets"
          echo "🔗 Release URL: ${{ steps.create_release.outputs.html_url }}"
