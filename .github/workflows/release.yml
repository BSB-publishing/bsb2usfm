name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 5.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify Python installation
        run: |
          python3 --version
          which python3
          # Ensure python command also works
          if ! command -v python &> /dev/null; then
            sudo ln -sf $(which python3) /usr/local/bin/python || true
          fi
          python --version || python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Read version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(cat VERSION)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Verify version consistency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILE_VERSION=$(cat VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Release version ($VERSION) does not match VERSION file ($FILE_VERSION)"
            echo "Update the VERSION file to $VERSION before releasing."
            exit 1
          fi
          echo "Version consistency check passed: $VERSION"

      - name: Refresh upstream sources
        run: make refresh

      - name: Build all files
        run: make all

      - name: Verify workspace files
        run: |
          echo "Checking BSB workspace..."
          find bereanbible/workspace -name "*.zip" -exec ls -lh {} \;
          echo ""
          echo "Checking MSB workspace..."
          find majoritybible/workspace -name "*.zip" -exec ls -lh {} \;
          echo ""
          echo "Total ZIP files:"
          find bereanbible/workspace majoritybible/workspace -name "*.zip" | wc -l

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BSB & MSB v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            # Berean Standard Bible & Majority Standard Bible v${{ steps.version.outputs.version }}

            This release contains the complete Berean Standard Bible (BSB) and Majority Standard Bible (MSB) in USFM, USJ, and USX formats.

            ## Berean Standard Bible (BSB) - Full Bible (66 books)

            ### USFM Format
            - **BSB_usfm.zip** - Standard clean text
            - **BSB_int_usfm.zip** - With interlinear data
            - **BSB_strongs_usfm.zip** - With Strong's numbers
            - **BSB_full_strongs_usfm.zip** - Complete Strong's data

            ### USJ Format (JSON)
            - **BSB_usj.zip** - Standard clean text
            - **BSB_int_usj.zip** - With interlinear data
            - **BSB_strongs_usj.zip** - With Strong's numbers
            - **BSB_full_strongs_usj.zip** - Complete Strong's data

            ### USX Format (XML)
            - **BSB_usx.zip** - Standard clean text
            - **BSB_int_usx.zip** - With interlinear data
            - **BSB_strongs_usx.zip** - With Strong's numbers
            - **BSB_full_strongs_usx.zip** - Complete Strong's data

            ### Paratext SFM Format
            - **BSB_sfm_for_paratext.zip** - Paratext-ready SFM files (Paratext naming convention)
            - **BSB_strongs_sfm_for_paratext.zip** - Paratext-ready SFM files with Strong's numbers

            ## Majority Standard Bible (MSB) - New Testament (27 books)

            ### USFM Format
            - **MSB_usfm.zip** - Standard clean text
            - **MSB_int_usfm.zip** - With interlinear data
            - **MSB_strongs_usfm.zip** - With Strong's numbers
            - **MSB_full_strongs_usfm.zip** - Complete Strong's data

            ### USJ Format (JSON)
            - **MSB_usj.zip** - Standard clean text
            - **MSB_int_usj.zip** - With interlinear data
            - **MSB_strongs_usj.zip** - With Strong's numbers
            - **MSB_full_strongs_usj.zip** - Complete Strong's data

            ### USX Format (XML)
            - **MSB_usx.zip** - Standard clean text
            - **MSB_int_usx.zip** - With interlinear data
            - **MSB_strongs_usx.zip** - With Strong's numbers
            - **MSB_full_strongs_usx.zip** - Complete Strong's data

            ### Paratext SFM Format
            - **MSB_sfm_for_paratext.zip** - Paratext-ready SFM files (Paratext naming convention)
            - **MSB_strongs_sfm_for_paratext.zip** - Paratext-ready SFM files with Strong's numbers

            ## License

            **Public Domain** - Both Bible texts are completely free to use:
            - Copy and distribute freely
            - Modify and adapt as needed
            - Use commercially without restriction
            - No attribution required (though appreciated)

            See [UNLICENSE](https://github.com/${{ github.repository }}/blob/main/UNLICENSE) for details.

            ## More Information

            Visit the [repository](https://github.com/${{ github.repository }}) for more details.
          files: |
            bereanbible/workspace/BSB_usfm.zip
            bereanbible/workspace/int/BSB_int_usfm.zip
            bereanbible/workspace/strongs/BSB_strongs_usfm.zip
            bereanbible/workspace/strongs_full/BSB_full_strongs_usfm.zip
            bereanbible/workspace/usj/BSB_usj.zip
            bereanbible/workspace/usj/int/BSB_int_usj.zip
            bereanbible/workspace/usj/strongs/BSB_strongs_usj.zip
            bereanbible/workspace/usj/strongs_full/BSB_full_strongs_usj.zip
            bereanbible/workspace/usx/BSB_usx.zip
            bereanbible/workspace/usx/int/BSB_int_usx.zip
            bereanbible/workspace/usx/strongs/BSB_strongs_usx.zip
            bereanbible/workspace/usx/strongs_full/BSB_full_strongs_usx.zip
            bereanbible/workspace/sfm_for_paratext/BSB_sfm_for_paratext.zip
            bereanbible/workspace/sfm_for_paratext/strongs/BSB_strongs_sfm_for_paratext.zip
            majoritybible/workspace/MSB_usfm.zip
            majoritybible/workspace/int/MSB_int_usfm.zip
            majoritybible/workspace/strongs/MSB_strongs_usfm.zip
            majoritybible/workspace/strongs_full/MSB_full_strongs_usfm.zip
            majoritybible/workspace/usj/MSB_usj.zip
            majoritybible/workspace/usj/int/MSB_int_usj.zip
            majoritybible/workspace/usj/strongs/MSB_strongs_usj.zip
            majoritybible/workspace/usj/strongs_full/MSB_full_strongs_usj.zip
            majoritybible/workspace/usx/MSB_usx.zip
            majoritybible/workspace/usx/int/MSB_int_usx.zip
            majoritybible/workspace/usx/strongs/MSB_strongs_usx.zip
            majoritybible/workspace/usx/strongs_full/MSB_full_strongs_usx.zip
            majoritybible/workspace/sfm_for_paratext/MSB_sfm_for_paratext.zip
            majoritybible/workspace/sfm_for_paratext/strongs/MSB_strongs_sfm_for_paratext.zip

      - name: Release Summary
        run: |
          echo "Release v${{ steps.version.outputs.version }} created successfully!"
          echo "28 ZIP files uploaded as release assets (14 BSB + 14 MSB)"
